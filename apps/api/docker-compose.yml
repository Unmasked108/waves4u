services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: >
        mongosh --quiet --eval "try{rs.status().ok}catch(e){rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok}"
      interval: 5s
      retries: 20
    ports: ["127.0.0.1:27018:27017"]   # localhost only, never expose Mongo publicly
  api:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/waves4u?replicaSet=rs0
    depends_on:
      mongo: { condition: service_healthy }
    ports: ["4000:4000"]
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    volumes: [backups:/app/backups]   # daily mongodump archives; sync this folder off-site
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/waves4u?replicaSet=rs0
    depends_on:
      mongo: { condition: service_healthy }
    restart: unless-stopped
volumes:
  mongo-data:
  backups:
